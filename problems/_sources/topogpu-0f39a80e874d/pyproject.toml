[build-system]
requires = ["setuptools>=61", "wheel", "Cython>=3.0.11", "numpy>=2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "topogpu"
version = "2.0.0"
description = "GPU-accelerated persistent homology for 2D/3D image data"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "nvidia-cuda-runtime-cu12>=12.6,<13"]