name: build-wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: seravee08/topogpu:v2.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Build binary and wheels
        shell: bash
        run: |
          export PATH=/root/.local/bin:/opt/rh/gcc-toolset-12/root/usr/bin:/usr/local/cuda/bin:$PATH
          export PATH="$(dirname "$(uv python find 3.12)"):$PATH"
          export LD_LIBRARY_PATH=/opt/rh/gcc-toolset-12/root/usr/lib64:/usr/local/cuda/lib64
          export CC=gcc CXX=g++ UV_PYTHON_INSTALL_DIR=/opt/python
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build.sh

      - name: Smoke test
        shell: bash
        run: |
          export PATH=/root/.local/bin:$PATH
          PY="$(uv python find 3.12)"
          "$PY" -m pip install --break-system-packages dist/topogpu-*-cp312-*.whl
          "$PY" -c "import topogpu; print('import ok')"

      - name: Keep build outputs as downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: |
            dist/*.whl
            build/topoGPU

      - name: Upload to GitHub Release (only when a tag was pushed)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'test') }}
          files: |
            dist/*.whl
            build/topoGPU