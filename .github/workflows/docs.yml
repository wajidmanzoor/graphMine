name: Public documentation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install documentation tools
        run: |
          python -m pip install -r requirements-docs.txt
          sudo apt-get update
          sudo apt-get install -y doxygen poppler-utils
      - name: Check catalog and generate current references
        run: |
          python3 tools/build_site_catalog.py --check
          node tools/build_code_docs.mjs
          python3 tools/build_public_note.py
      - name: Build and check public content
        run: |
          mkdocs build --strict
          python3 tools/check_public_site.py
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
