[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "graphmine-agent"
version = "1.0.0"
description = "Private-LAN agent, job service, and interactive UI for GraphMine"
readme = {text = "GraphMine provides a private graph-analysis workspace, authenticated API and durable native workflows. The application requires the repository catalog and matching verified native artifacts. See docs/ANALYTICS_WORKSPACE.md in the source checkout for installation and operation.", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.10,<5",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30,<1",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
web = ["selenium>=4.25,<5"]
databases = ["neo4j>=5.26,<7", "psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4", "paramiko>=3.4,<5"]
# Built from third_party/tento by deploy/tento/build.sh; not a PyPI Ladybug wheel.
semantic = ["graphmine-tento==0.1.0+62e124217e2c"]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "selenium>=4.25,<5",
  "playwright>=1.50,<2",
]

[project.scripts]
graphmine-agent = "graphmine_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["graphmine_agent"]

[tool.hatch.build.targets.wheel.force-include]
"visualization/validate.mjs" = "visualization/validate.mjs"
"visualization/package.json" = "visualization/package.json"
"visualization/package-lock.json" = "visualization/package-lock.json"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
